# =====================================================================
#  Deal-Radar – allgemeine Einstellungen
#  Diese Datei kannst du direkt im GitHub-Webeditor ändern (Stift-Symbol).
# =====================================================================

# Bis wann läuft das Radar im normalen Takt? Format JJJJ-MM-TTTHH:MM oder "nie".
# Per Telegram änderbar:  /ende 24.12.2026   oder   /ende nie
enddatum: "2026-11-30T23:59"
# Was passiert danach?
#   wunschliste = Wunschlisten-Modus: weiter 1x täglich suchen und melden (Standard)
#   aus         = Radar beendet sich, der Workflow schaltet sich selbst ab
nach_ende: wunschliste
zeitzone: "Europe/Berlin"

# Wie oft gesucht wird (der Cloudflare Worker startet die Läufe; GitHub läuft alle 2 Std. als Reserve)
zeitplan:
  normal_minuten: 120            # normal: alle 2 Stunden
  aktion_minuten: 30             # Aktionszeit: alle 30 Minuten …
  aktion_von: "2026-11-27T00:00" # … von Black Friday
  aktion_bis: "2026-11-30T23:59" # … bis Cyber Monday
  wunschliste_uhrzeit: "08:00"   # Wunschlisten-Modus: täglich um diese Uhrzeit

# So meldet sich das Tool bei Webseiten. Bitte ehrlich lassen.
user_agent: "DealRadar/1.0 (private Preisbeobachtung; Open-Source-Bot, max. 1 Abruf/30 Min.)"

# Höflichkeit: Mindestpause zwischen zwei Abrufen bei derselben Webseite (Sekunden)
pause_sekunden: 3
# Wie lange auf eine Antwort gewartet wird (Sekunden)
timeout_sekunden: 25

# Datenquellen einzeln an-/ausschalten (true = an, false = aus)
quellen:
  mydealz: true        # RSS-Feeds der mydealz-Gruppen
  ebay: true           # eBay Browse API (nur aktiv, wenn die eBay-Secrets gesetzt sind)
  shop: true           # konkrete Shop-Produktseiten (Preis aus JSON-LD / Microdata)
  leasingmarkt: true   # LeasingMarkt.de (nur für Produkte mit typ: leasing)
  sparneuwagen: true   # Sparneuwagen.de Haupt-Feed (nur für typ: leasing)
  mein-deal: true      # RSS-Feed mein-deal.com
  mytopdeals: true     # RSS-Feed MyTopDeals
  schnaeppchenfuchs: false # AUS: sperrt GitHub-Server schon bei der robots.txt aus (Bot-Schutz, wird nicht umgangen)
  dealdoktor: true     # RSS-Feed Dealdoktor
  hersteller: true     # Herstellershops aus shops.yaml (Tefal, Cosori)
  postfach: true       # Gmail-Deal-Postfach (nur aktiv, wenn die Mail-Secrets gesetzt sind)

# Diese Quellen höchstens so oft abfragen (Minuten) – auch wenn das Radar öfter läuft.
# Leasing-Angebote hängen nicht am Black Friday; so werden die Seiten geschont.
quellen_mindestabstand_minuten:
  leasingmarkt: 110
  sparneuwagen: 110

# 💥 Rabattknaller: große Rabatte in ganzen Kategorien – auch für Produkte, die NICHT auf deiner Liste stehen.
# Bezug ist der PREISVERGLEICH (PVG, idealo, Geizhals), nicht UVP/Streichpreis. Sehr „heiße“ mydealz-Deals
# (Temperatur ab hitze_ab °) zählen auch. Ab sofort_ab_prozent kommt die Meldung sofort (Ruhezeiten gelten),
# sonst in der Tagesübersicht um 19 Uhr. Gesucht wird bei jedem Lauf (Black Friday bis Cyber Monday alle 30 Min.).
# Begriffe: muss = alle im Titel · eines_von = mind. einer im Titel · zusatz_eines_von = mind. einer in Titel
# oder Text · ausschluss = keiner im Titel. Kurze Begriffe (≤ 3 Zeichen, z. B. „Ah“) zählen nur als ganzes Wort.
rabattknaller:
  aktiv: true
  ab_prozent: 30
  sofort_ab_prozent: 40
  hitze_ab: 300
  kategorien:
    schlagbohrset:
      name: "Akku-Schlagbohrschrauber-Set"
      gruppen: [akkuschrauber, werkzeug]
      muss: ["schlagbohrschrauber"]
      zusatz_eines_von: ["set", "2x", "akkus", "inkl. akku", "mit akku", "Ah", "koffer"]
      ausschluss: ["solo", "ohne akku", "ohne ladegerät", "tool only", "nur gerät", "body", "bit-set", "bohrer-set"]
      max_preis: 300
    monitor:
      name: "Computer-Monitor"
      gruppen: [monitor]
      eines_von: ["monitor", "gaming-monitor", "bildschirm"]
      ausschluss: ["halterung", "monitorarm", "monitor-arm", "ständer", "kabel", "babyphone", "lampe", "lightbar",
                   "blutdruck", "herzfrequenz", "puls", "schutzfolie", "adapter", "kvm", "tisch", "reiniger"]
      max_preis: 300
    airfryer:
      name: "Airfryer"
      gruppen: [fritteusen]
      eines_von: ["airfryer", "air fryer", "heißluftfritteuse", "heissluftfritteuse", "heißluft-fritteuse",
                  "heissluft-fritteuse", "dual zone", "dualzone", "easy fry", "turbo blaze"]
      ausschluss: ["zubehör", "backpapier", "einsatz", "liner", "silikon", "rezept", "kochbuch", "ersatz", "korb"]
      max_preis: 200
    farbdrucker:
      name: "Farbdrucker"
      gruppen: [drucker, multifunktionsdrucker]
      eines_von: ["drucker", "ecotank", "megatank", "officejet", "deskjet", "pixma", "envy", "workforce",
                  "color laser", "farblaser"]
      ausschluss: ["3d", "toner", "tintenpatrone", "druckerpatrone", "nachfülltinte", "tintenflasche", "ersatztinte",
                   "druckerpapier", "fotopapier", "etiketten", "label", "s/w", "schwarzweiß", "schwarz-weiß",
                   "monochrom", "mono", "bondrucker", "beschrifter"]
      max_preis: 300
    wasserkocher:
      name: "Wasserkocher"
      gruppen: [wasserkocher]
      eines_von: ["wasserkocher", "teekocher", "kettle"]
      ausschluss: ["entkalker", "kalkfilter", "ersatzfilter", "ersatzteil", "deckel", "dichtung", "frühstücksset",
                   "frühstücks-set", "toaster", "reisewasserkocher-adapter"]
      max_preis: 100

# Abgelaufene mydealz-Deals erkennen (Deal-Seite wird geöffnet; laut robots.txt erlaubt)
ablauf:
  aktiv: true
  pruefen_stunden: 3     # laufende Deals höchstens so oft erneut prüfen
  max_abrufe: 25         # höchstens so viele Deal-Seiten pro Lauf
  merken_tage: 14

# Telegram-Warnung, wenn eine Quelle so viele Läufe in Folge ausfällt (und Entwarnung danach)
quellen_alarm_nach: 3

# Diese mydealz-Feeds werden immer für ALLE Produkte durchsucht
# (zusätzlich zu den Gruppen, die beim Produkt stehen).
mydealz_immer: ["alles", "hot"]

# LeasingMarkt: wie viele Ergebnisseiten (je 15 Angebote) maximal geladen werden
leasingmarkt_max_seiten: 20   # alle Ergebnisseiten (Stand 24.11.: 18); Elektro-Angebote stehen oft weiter hinten
# ... und für wie viele Angebote pro Lauf die Detailseite (Sonderzahlung,
# Überführung) nachgeladen wird
leasingmarkt_max_details: 4

# Regeln für einen "guten Deal"
regeln:
  # Melden, wenn mindestens so viel % unter dem bisher niedrigsten Preis (0.10 = 10 %)
  rabatt_vs_tiefstpreis: 0.10
  # "verdächtig", wenn Preis unter diesem Anteil des Medians liegt (0.40 = 40 %)
  verdacht_unter_median: 0.40
  # So lange gilt ein gesehenes Angebot als "aktuell" (Stunden)
  aktuell_stunden: 48
  # Nach so vielen Tagen werden alte Angebote aus dem Speicher entfernt
  vergessen_nach_tagen: 7

# Effektivpreis = Preis + Versand − Gutschein − Cashback − Zahlungsrabatt
effektivpreis:
  # Gutscheine aus dem Deal-Postfach abziehen (nur wenn Shop, Mindestbestellwert und Gültigkeit passen)
  gutscheine_aus_postfach: true
  # Cashback je Shop in Prozent, z. B. {Otto: 3, MediaMarkt: 1.5} – Shoop lässt sich nicht automatisch
  # auslesen; leer = kein Cashback eingerechnet
  cashback: {}
  # Rabatt deiner Zahlart in Prozent (z. B. Kreditkarte mit Cashback); 0 = keiner
  zahlungsrabatt_prozent: 0
  # optional: Zahlungsrabatt nur bei diesen Shops, z. B. [Amazon]; leer = überall
  zahlungsrabatt_nur_shops: []

# Für den Hinweis "Kaufen oder warten?"
aktionstage:
  black_friday: "2026-11-27"
  cyber_monday: "2026-11-30"
  weihnachten: "2026-12-24"

# Welche Deals kommen SOFORT aufs Handy? (alles andere steht in der Tagesübersicht)
meldungen:
  # Sofort, wenn der Zielpreis erreicht ist ODER der Deal-Score mindestens so hoch ist
  sofort_ab_score: 85
  # Tägliche Übersicht (verschickt der Cloudflare Worker, volle Stunde)
  uebersicht_uhrzeit: "19:00"

# Ruhezeiten: Sofort-Meldungen werden zurückgehalten und danach nachgeliefert.
# Ein-/ausschalten auch per Telegram: /ruhe an  bzw.  /ruhe aus
# "tage" gilt für den Beginn; 22:00–07:00 reicht also in den nächsten Morgen.
ruhezeiten:
  aktiv: false
  zeiten:
    - {tage: "Mo-Fr", von: "07:30", bis: "14:00"}
    - {tage: "Mo-So", von: "22:00", bis: "07:00"}
  # Ausnahmen – kommen auch in der Ruhezeit sofort:
  ausnahme_ab_score: 90        # Deal-Score mindestens 90
  ausnahme_unter_ziel: 0.15    # Zielpreis um mehr als 15 % unterboten
