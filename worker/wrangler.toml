# Cloudflare Worker für den Deal-Radar-Telegram-Bot (kostenloser Plan reicht).
# Geheime Werte NICHT hier eintragen, sondern mit:  npx wrangler secret put NAME
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GITHUB_TOKEN, WEBHOOK_SECRET
name = "deal-radar-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# "17 */2 * * *": alle 2 Stunden (Minute 17, UTC) einen Suchlauf auf GitHub starten
# "0 * * * *":    jede volle Stunde Ruhezeit-Meldungen nachliefern / Tagesübersicht (19 Uhr)
[triggers]
crons = ["17 */2 * * *", "0 * * * *"]

# Kleiner Speicher des Bots: Link-Vorschauen, bereits verschickte Meldungen
# (kostenlos; angelegt mit: npx wrangler kv namespace create deal-radar-bot)
[[kv_namespaces]]
binding = "KV"
id = "73679f6d184744a2bcddcdad649e41d6"

[vars]
GITHUB_REPO = "mjkschule/deal-radar"
GITHUB_BRANCH = "main"
PAGE_URL = "https://mjkschule.github.io/deal-radar/"
