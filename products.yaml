# =====================================================================
#  Deal-Radar – deine Produkte
#
#  Jeder Eintrag beginnt mit "- id:". Zum Hinzufügen einfach das Beispiel
#  ganz unten kopieren, das "#" am Zeilenanfang entfernen und anpassen.
#  Wichtig: Einrückung mit LEERZEICHEN (nicht Tab), genau wie bei den anderen.
#
#  Felder:
#   id               kurzer eindeutiger Name, nur a-z, 0-9 und "-"
#   name             Anzeigename
#   kategorie        frei wählbar, z. B. werkzeug, drucker, monitor, zubehoer, auto
#   typ              "produkt" (Standard) oder "leasing"
#   suchbegriffe     Liste. Ein Angebot passt, wenn ALLE Wörter EINES Begriffs
#                    im Titel vorkommen (Groß/klein egal). Modellnummern wie
#                    "DHP490RFX3" werden auch mit Leerzeichen erkannt ("DHP 490 RFX3").
#   zielpreis        Alarm, wenn Preis (inkl. Versand) <= Zielpreis
#                    (bei Leasing: Monatsrate <= Zielpreis)
#   ausschluss       optional: Wörter, die NICHT vorkommen dürfen
#   shop_urls        optional: konkrete Produktseiten, deren Preis direkt gelesen wird
#   mydealz_gruppen  optional: mydealz-Gruppen (die Adresse mydealz.de/gruppe/<name>)
#   ebay_suche       optional: Suchtext für eBay (Standard: erster Suchbegriff)
#   pflicht_hinweise optional: Wörter, die im Angebot stehen sollten; fehlen sie,
#                    gibt es den Hinweis "bitte prüfen"
#   mindestwerte     optional: z. B. {Hz: 75} oder {kg: 5}. Steht ein kleinerer Wert
#                    im Angebot, wird es aussortiert; steht keiner da: "bitte prüfen"
#   notizen          optional: freier Text, erscheint auf der Startseite
# =====================================================================

