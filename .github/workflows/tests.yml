# Führt die Tests aus, wenn Code geändert wird.
name: Tests
on:
  push:
    paths: ["dealradar/**", "tests/**", "products.yaml", "config.yaml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
