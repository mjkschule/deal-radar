# Deal-Radar: läuft alle 2 Stunden, sucht Angebote, meldet per Telegram,
# aktualisiert die Startseite (GitHub Pages) und speichert den Preisverlauf im Repo.
# Nach dem Enddatum (config.yaml) schaltet sich dieser Workflow selbst ab.
name: Deal-Radar

on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden, Minute 17 (UTC; GitHub startet oft etwas später)
  repository_dispatch:        # vom Telegram-Bot (Cloudflare Worker): Zeitplan und nach Befehlen
    types: [radar]
  workflow_dispatch:          # "Run workflow"-Knopf zum manuellen Auslösen
    inputs:
      test_telegram:
        description: "Nur eine Telegram-Testnachricht senden"
        type: boolean
        default: false
      test_meldung:
        description: "Nur eine Beispiel-Meldung mit Buttons senden – Nummer aus /liste oder id (leer = normaler Lauf)"
        type: string
        default: ""

permissions:
  contents: write   # Preisverlauf committen
  actions: write    # Workflow nach dem Enddatum abschalten
  pages: write      # Startseite veröffentlichen
  id-token: write

concurrency:
  group: deal-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy_try.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Immer den neuesten Stand holen: Läufe vom Bot warten evtl. in der Schlange,
          # und sonst würde der Stand vom Zeitpunkt des Befehls benutzt.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Enddatum prüfen
        id: ende
        run: python -m dealradar.ende

      - name: Enddatum erreicht – Workflow abschalten
        if: steps.ende.outputs.beendet == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Black Friday ist vorbei – Deal-Radar schaltet sich ab."
          gh workflow disable radar.yml --repo "${{ github.repository }}"

      - name: Telegram-Testnachricht
        if: steps.ende.outputs.beendet != 'true' && inputs.test_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m dealradar.main --test-telegram

      - name: Telegram-Beispielmeldung mit Buttons
        if: steps.ende.outputs.beendet != 'true' && inputs.test_meldung != '' && !inputs.test_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MELDUNG: ${{ inputs.test_meldung }}
        run: python -m dealradar.main --test-meldung "$TEST_MELDUNG"

      - name: Deal-Radar ausführen
        id: run
        if: steps.ende.outputs.beendet != 'true' && !inputs.test_telegram && (inputs.test_meldung == '' || inputs.test_meldung == null)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}   # für Telegram-Befehle: products.yaml per API committen
          RADAR_GRUND: ${{ github.event.client_payload.grund }}   # "zeitplan" oder "befehl" (vom Worker)
        run: python -m dealradar.main

      - name: Preisverlauf speichern (Commit)
        if: steps.run.outcome == 'success' && steps.run.outputs.lauf != 'uebersprungen'
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs products.yaml
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Deal-Radar: Lauf $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            # Bei Konflikten in den Lauf-Daten gewinnt dieser (neueste) Lauf;
            # Änderungen an products.yaml vom Bot bleiben unberührt.
            git pull --rebase --autostash -X theirs
            git push
          fi

      - name: Startseite vorbereiten
        if: steps.run.outcome == 'success' && steps.run.outputs.lauf != 'uebersprungen'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Startseite veröffentlichen
        id: deploy_try
        if: steps.run.outcome == 'success' && steps.run.outputs.lauf != 'uebersprungen'
        continue-on-error: true   # GitHub findet das Artefakt manchmal erst Sekunden später
        uses: actions/deploy-pages@v5

      - name: Kurz warten (zweiter Versuch)
        if: steps.run.outcome == 'success' && steps.run.outputs.lauf != 'uebersprungen' && steps.deploy_try.outcome == 'failure'
        run: sleep 30

      - name: Startseite veröffentlichen (zweiter Versuch)
        id: deploy
        if: steps.run.outcome == 'success' && steps.run.outputs.lauf != 'uebersprungen' && steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v5
